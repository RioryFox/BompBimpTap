[platformio]
src_dir = .

[env:lxb723]
upload_protocol = dfu
build_flags = -D PIO_FRAMEWORK_ENABLE_CDC -D PIO_FRAMEWORK_ARDUINO_USB_HIGHSPEED_FULLMODE
board_upload.offset_address = 0x08000000
platform = ststm32
board = nucleo_h723zg
board_build.arduino.board = GENERIC_H723ZGTX
framework = arduino


board_build.mcu = stm32h723zgt6

build_src_filter =  +<main.cpp>