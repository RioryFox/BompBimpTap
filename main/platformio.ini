[platformio]
src_dir = .

[env:lxb723]
upload_protocol = custom
upload_command = nix shell nixpkgs#dfu-util -c dfu-util -d 0483:df11 -a 0 -s 0x08000000:leave -D $SOURCE
board_upload.offset_address = 0x08000000
platform = ststm32
board = nucleo_h723zg
framework = arduino


board_build.mcu = stm32h723zgt6

build_src_filter =  +<main.cpp>